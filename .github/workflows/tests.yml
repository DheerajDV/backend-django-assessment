name: Django checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt ruff==0.16.9
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test planner.tests
      - run: ruff check .
