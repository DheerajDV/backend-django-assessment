# One always-on assessment demo with 1 GB persistent storage. This is a paid plan.
# Creating this Blueprint incurs Render's 0.5 CPU / 512 MB service and disk charges.
services:
  - type: web
    name: spotter-fuel-planner
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    buildCommand: bash scripts/build.sh
    startCommand: bash scripts/start.sh
    healthCheckPath: /api/health/
    disk:
      name: fuel-planner-data
      mountPath: /var/data/fuel-planner-data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: RUNTIME_DIR
        value: /var/data/fuel-planner-data
      - key: DJANGO_TRUST_PROXY_HEADERS
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Override Render's default Gunicorn arguments with the checked-in config.
      - key: GUNICORN_CMD_ARGS
        value: ""
